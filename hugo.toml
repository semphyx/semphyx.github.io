baseURL = 'https://semphyx.github.io/'
languageCode = 'ja'
title = 'semphyx'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# タグ・RSS は使わない
disableKinds = ["taxonomy", "term", "rss"]

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description = "研究紹介サイト"
  author = "semphyx"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\[', '\]']]
          inline = [['$', '$'], ['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[[menu.main]]
  identifier = "home"
  name = "ホーム"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "links"
  name = "リンク"
  url = "/links/"
  weight = 30

[outputs]
  home = ["HTML"]

