baseURL = 'https://semphyx.github.io/'
languageCode = 'ja'
title = '半導体の余白ノート'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# タグ・RSS は使わない
disableKinds = ["taxonomy", "term", "rss"]

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description = "半導体物理や数学などの学習ノートを発信しています"
  author = "半導体の余白ノート"
  # サイドバーの題字(上段は小さく、下段は大きく表示)
  titleSub = "半導体の"
  titleMain = "余白ノート"

  # ノートのコメント欄(giscus)。repoId と categoryId を https://giscus.app で取得して記入すると表示される
  [params.giscus]
    repo = "semphyx/semphyx.github.io"
    repoId = "R_kgDORwac8g"
    category = "Announcements"
    categoryId = "DIC_kwDORwac8s4DMECg"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\[', '\]']]
          inline = [['$', '$'], ['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[[menu.main]]
  identifier = "home"
  name = "ホーム"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "links"
  name = "リンク"
  url = "/links/"
  weight = 30

[outputs]
  home = ["HTML"]

# サイドバーで見出しつきのグループを作る例(parent を持つ項目がその見出しの下に並びます)
