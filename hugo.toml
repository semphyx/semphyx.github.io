baseURL = 'https://semphyx.github.io/'
languageCode = 'ja'
title = 'semphyx'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[minify]
  disableXML = true
  minifyOutput = true

[params]
  description = "研究紹介サイト"
  author = "semphyx"
  github = "https://github.com/semphyx"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\[', '\]']]
          inline = [['$', '$'], ['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[[menu.main]]
  identifier = "home"
  name = "ホーム"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "posts"
  name = "記事"
  url = "/posts/"
  weight = 20

[[menu.main]]
  identifier = "links"
  name = "リンク"
  url = "/links/"
  weight = 30

[outputs]
  home = ["HTML", "RSS"]

