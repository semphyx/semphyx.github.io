{{- /* ノートのコメント欄(giscus)。repoId と categoryId が設定されているときだけ表示する */ -}}
{{- with site.Params.giscus }}
{{- if and .repoId .categoryId }}
<section class="section comments">
  {{ partial "section-head.html" (dict "en" "Comments" "ja" "コメント") }}
  <p class="comments-note">コメントには GitHub アカウントが必要です。数式($...$)や Markdown が使えます。</p>
  <div id="giscus-container"></div>
  <script>
    (function () {
      var root = document.documentElement;
      function currentTheme() {
        var t = root.getAttribute("data-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        return t === "dark" ? "dark_dimmed" : "light";
      }
      var s = document.createElement("script");
      s.src = "https://giscus.app/client.js";
      s.async = true;
      s.crossOrigin = "anonymous";
      var attrs = {
        "data-repo": {{ .repo }},
        "data-repo-id": {{ .repoId }},
        "data-category": {{ .category }},
        "data-category-id": {{ .categoryId }},
        "data-mapping": "pathname",
        "data-strict": "1",
        "data-reactions-enabled": "1",
        "data-emit-metadata": "0",
        "data-input-position": "top",
        "data-theme": currentTheme(),
        "data-lang": "ja",
        "data-loading": "lazy"
      };
      for (var k in attrs) s.setAttribute(k, attrs[k]);
      document.getElementById("giscus-container").appendChild(s);

      // ライト/ダークを切り替えたらコメント欄の配色も合わせる
      new MutationObserver(function () {
        var f = document.querySelector("iframe.giscus-frame");
        if (f) f.contentWindow.postMessage({ giscus: { setConfig: { theme: currentTheme() } } }, "https://giscus.app");
      }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    })();
  </script>
</section>
{{- end }}
{{- end }}
