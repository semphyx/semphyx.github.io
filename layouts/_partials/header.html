{{ $current := .RelPermalink }}
<header class="site-header">
  <div class="container header-row">
    <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <button class="theme-toggle" type="button" aria-label="ライト/ダークを切り替え" title="ライト/ダークを切り替え">
      <span class="icon-sun" aria-hidden="true">☀</span><span class="icon-moon" aria-hidden="true">☾</span>
    </button>
  </div>
  <nav class="site-nav" aria-label="メインメニュー">
    <ul class="container">
      {{ range site.Menus.main }}
        {{ $url := .URL | relURL }}
        {{ $active := or (eq $current $url) (and (ne .URL "/") (hasPrefix $current $url)) }}
        <li><a href="{{ $url }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
