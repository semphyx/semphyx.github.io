name: Deploy Hugo site to Pages

# main(本番)と staging(ステージング)のどちらに push されても、
# 両方をビルドして 1 つのサイトとして公開する。
#   本番         https://semphyx.github.io/          ← main
#   ステージング https://semphyx.github.io/staging/  ← staging
on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.0
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
      TZ: Asia/Tokyo
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main
          fetch-depth: 0

      - name: Check whether the staging branch exists
        id: staging
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" staging >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout staging
        if: steps.staging.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          path: site-staging
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build production (main)
        run: |
          hugo --source site-main \
            --gc --minify \
            --environment production \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --destination "${{ github.workspace }}/public"

      - name: Build staging (staging)
        if: steps.staging.outputs.exists == 'true'
        run: |
          hugo --source site-staging \
            --gc --minify \
            --environment staging \
            --baseURL "${{ steps.pages.outputs.base_url }}/staging/" \
            --destination "${{ github.workspace }}/public/staging"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
